
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Market</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
    header { background: #123c69; color: white; padding: 22px 16px; text-align: center; }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }
    nav { background: white; padding: 14px; text-align: center; }
    nav a { color: #123c69; margin: 0 10px; text-decoration: none; font-weight: bold; }
    .search { padding: 20px 14px; text-align: center; }
    input { padding: 13px; width: 70%; max-width: 450px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 13px 18px; background: #16834a; color: white; border: 0; border-radius: 8px; cursor: pointer; }
    h2 { text-align: center; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 14px; padding: 16px; max-width: 1000px; margin: auto; }
    .product { background: white; padding: 16px; border-radius: 12px; text-align: center; box-shadow: 0 2px 7px #ddd; }
    .emoji { font-size: 55px; }
    .product h3 { font-size: 17px; }
    .price { color: #16834a; font-weight: bold; }
    .sell { background: white; padding: 20px; margin: 16px; border-radius: 12px; }
    .sell input { width: 100%; margin: 8px 0; }
    footer { background: #123c69; color: white; text-align: center; padding: 20px; margin-top: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>🌍 Global Market</h1>
    <p>Buy and Sell Products Around the World</p>
  </header>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#sell">Sell Products</a>
  </nav>
  <section class="search" id="home">
    <input id="search" placeholder="Search products..." oninput="filterProducts()">
    <button onclick="filterProducts()">Search</button>
  </section>
  <h2>Featured Products</h2>
  <section class="products" id="products">
    <article class="product">
      <div class="emoji">📱</div>
      <h3>Smartphone</h3>
      <p class="price">$150</p>
      <button onclick="contactSeller('Smartphone')">Contact Seller</button>
    </article>
    <article class="product">
      <div class="emoji">👟</div>
      <h3>Shoes</h3>
      <p class="price">$35</p>
      <button onclick="contactSeller('Shoes')">Contact Seller</button>
    </article>
    <article class="product">
      <div class="emoji">💻</div>
      <h3>Laptop</h3>
      <p class="price">$400</p>
      <button onclick="contactSeller('Laptop')">Contact Seller</button>
    </article>
    <article class="product">
      <div class="emoji">👕</div>
      <h3>Clothes</h3>
      <p class="price">$20</p>
      <button onclick="contactSeller('Clothes')">Contact Seller</button>
    </article>
  </section>
  <section class="sell" id="sell">
    <h2>Sell Your Product</h2>
    <p>Enter your product details:</p>
    <input id="sellerName" placeholder="Your name">
    <input id="productName" placeholder="Product name">
    <input id="productPrice" type="number" placeholder="Price in USD">
    <button onclick="listProduct()">Submit Product</button>
    <p id="message"></p>
  </section>
  <footer>
    <p>Global Market © 2026</p>
    <p>Connecting Buyers and Sellers Worldwide</p>
  </footer>
  <script>
    function filterProducts() {
      const q = document.getElementById('search').value.toLowerCase();
      document.querySelectorAll('.product').forEach(p => {
        p.style.display = p.innerText.toLowerCase().includes(q) ? '' : 'none';
      });
    }
    function contactSeller(product) {
      alert('You selected ' + product + '. Seller contact features will be added next.');
    }
    function listProduct() {
      const name = document.getElementById('productName').value.trim();
      const price = document.getElementById('productPrice').value;
      const seller = document.getElementById('sellerName').value.trim();
      if (!name || !price || !seller) {
        document.getElementById('message').innerText = 'Please fill in all fields.';
        return;
      }
      document.getElementById('message').innerText =
        'Thank you, ' + seller + '! Your product details were entered. A real listing system will be added next.';
    }
  </script>
</body>
</html>
