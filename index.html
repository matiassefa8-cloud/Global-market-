<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header,footer{background:#123c69;color:white;text-align:center;padding:22px}
nav{background:white;padding:15px;text-align:center}
nav a{margin:10px;color:#123c69;text-decoration:none;font-weight:bold}
.search{text-align:center;padding:20px}
input{padding:12px;border:1px solid #ccc;border-radius:7px;width:100%;margin:7px 0}
.search input{max-width:450px;width:65%}
button{padding:12px 16px;border:0;border-radius:7px;background:#16834a;color:white;cursor:pointer}
h2{text-align:center}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;padding:16px;max-width:1000px;margin:auto}
.product,.sell{background:white;padding:16px;border-radius:12px;box-shadow:0 2px 7px #ddd}
.product{text-align:center}
.emoji{font-size:45px}
.price{color:#16834a;font-weight:bold}
.sell{margin:16px auto;max-width:600px}
#message{text-align:center;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>🌍 Global Market</h1>
<p>Buy and Sell Products Around the World</p>
</header>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#sell">Sell Products</a>
</nav>
<section class="search" id="home">
<input id="search" placeholder="Search products...">
<button onclick="loadProducts()">Search</button>
</section>
<h2>Products</h2>
<section class="products" id="products">Loading products...</section>
<section class="sell" id="sell">
<h2>Sell Your Product</h2>
<form id="productForm">
<label>Your name</label>
<input id="sellerName" required maxlength="100" placeholder="Your name">
<label>Product name</label>
<input id="productName" required maxlength="150" placeholder="Product name">
<label>Price in USD</label>
<input id="productPrice" required type="number" min="0.01" step="0.01" placeholder="Price">
<button type="submit">Submit Product</button>
</form>
<p id="message" role="status"></p>
</section>
<footer>
<p>Global Market © 2026</p>
<p>Connecting Buyers and Sellers Worldwide</p>
</footer>
<script>
const SUPABASE_URL='https://cnygdhpbuqopmnbfkzmd.supabase.co';
const SUPABASE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';
const productsArea=document.getElementById('products');
const message=document.getElementById('message');

async function loadProducts(){
  productsArea.textContent='Loading products...';
  try{
    const q=document.getElementById('search').value.trim();
    const response=await fetch(
      SUPABASE_URL+'/rest/v1/products?select=id,name,price,seller&order=id.desc',
      {headers:{apikey:SUPABASE_KEY}}
    );
    if(!response.ok) throw new Error('Could not load products. Check permissions.');
    const products=await response.json();
    const filtered=products.filter(p=>String(p.name).toLowerCase().includes(q.toLowerCase()));
    productsArea.replaceChildren();
    if(!filtered.length){productsArea.textContent='No products found.';return;}
    filtered.forEach(p=>{
      const card=document.createElement('article');
      card.className='product';
      const emoji=document.createElement('div');
      emoji.className='emoji';emoji.textContent='🛍️';
      const title=document.createElement('h3');title.textContent=p.name;
      const price=document.createElement('p');
      price.className='price';price.textContent='$'+Number(p.price).toFixed(2);
      const seller=document.createElement('p');
      seller.textContent='Seller: '+(p.seller||'Not listed');
      card.append(emoji,title,price,seller);
      productsArea.appendChild(card);
    });
  }catch(error){productsArea.textContent=error.message;}
}

document.getElementById('productForm').addEventListener('submit',async function(event){
  event.preventDefault();
  const seller=document.getElementById('sellerName').value.trim();
  const name=document.getElementById('productName').value.trim();
  const price=Number(document.getElementById('productPrice').value);
  if(!seller||!name||!Number.isFinite(price)||price<=0){
    message.textContent='Enter a name and a valid price.';return;
  }
  message.textContent='Saving product...';
  try{
    const response=await fetch(SUPABASE_URL+'/rest/v1/products',{
      method:'POST',
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json',
        Prefer:'return=minimal'
      },
      body:JSON.stringify({name:name,price:price,seller:seller})
    });
    if(!response.ok) throw new Error('Save failed. Check API key, table and permissions.');
    message.textContent='Product submitted successfully!';
    this.reset();
    await loadProducts();
  }catch(error){message.textContent=error.message;}
});
loadProducts();
</script>
</body>
  </html>
