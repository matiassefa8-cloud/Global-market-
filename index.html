
 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5f9;color:#222}
header{background:#123c69;color:white;padding:22px;text-align:center}
main{max-width:850px;margin:20px auto;padding:15px}
section{background:white;padding:18px;margin-bottom:18px;border-radius:10px}
input,button{width:100%;padding:12px;margin:7px 0;border-radius:6px;border:1px solid #ccc;font-size:16px}
button{background:#123c69;color:white;border:0;cursor:pointer}
.product{border-bottom:1px solid #ddd;padding:12px 0}
.price{color:#167344;font-weight:bold}
small{color:#555}
</style>
</head>
<body>
<header>
<h1>Global Market</h1>
<p>Buy and sell products around the world</p>
</header>
<main>
<section>
<h2>Search products</h2>
<input id="search" placeholder="Search products..." oninput="showProducts()">
<div id="products">Loading products...</div>
</section>
<section>
<h2>Sell a product</h2>
<form id="productForm">
<input id="name" placeholder="Product name" required>
<input id="price" type="number" min="0.01" step="0.01" placeholder="Price" required>
<button type="submit">Add product</button>
<p id="message"></p>
</form>
</section>
</main>
<script>
const SUPABASE_URL='https://cnygdhpbuqopmnbfkzmd.supabase.co';
let allProducts=[];const SUPABASE_KEY='sb_publishable_RiQYt-kRIEHha2VmyZ7y1g_l-eBCgtP';

async function loadProducts(){
try{
const r=await fetch(SUPABASE_URL+'/rest/v1/products?select=id,name,price&order=id.desc',{
headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
});
if(!r.ok)throw Error('Could not load products');
allProducts=await r.json();
showProducts();
}catch(e){
document.getElementById('products').textContent='Products will appear here when database access is configured.';
}
}

function showProducts(){
const term=document.getElementById('search').value.toLowerCase();
const list=document.getElementById('products');
list.replaceChildren();
const matches=allProducts.filter(p=>String(p.name).toLowerCase().includes(term));
if(!matches.length){
list.textContent='No products found yet.';
return;
}
matches.forEach(p=>{
const item=document.createElement('div');
item.className='product';
const name=document.createElement('strong');
name.textContent=p.name;
const price=document.createElement('p');
price.className='price';
price.textContent='$'+Number(p.price).toFixed(2);
item.append(name,price);
list.appendChild(item);
});
}

document.getElementById('productForm').addEventListener('submit',async function(e){
e.preventDefault();
const message=document.getElementById('message');
const name=document.getElementById('name').value.trim();
const price=Number(document.getElementById('price').value);
if(!name||!Number.isFinite(price)||price<=0){
message.textContent='Enter a product name and a valid price.';
return;
}
message.textContent='Saving product...';
try{
const r=await fetch(SUPABASE_URL+'/rest/v1/products',{
method:'POST',
headers:{
'apikey':SUPABASE_KEY,
'Authorization':'Bearer '+SUPABASE_KEY,
'Content-Type':'application/json',
'Prefer':'return=minimal'
},
body:JSON.stringify({name:name,price:price})
});
if(!r.ok)throw Error('Save failed');
message.textContent='Product added successfully!';
this.reset();
await loadProducts();
}catch(err){
message.textContent='Saving failed. The Supabase key or database permissions need setup.';
}
});

loadProducts();
</script>
</body>
</html>
